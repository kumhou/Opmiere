[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opmiere"
version = "0.1.7"
description = "Open Premiere — an open-source, agent-native video editor for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "kumhou" }]
keywords = ["video", "editor", "nle", "ai", "agent", "mcp", "ffmpeg"]

# The editing core (model/bundle/render/ops) shells out to the system
# `ffmpeg`/`ffprobe` binaries and needs nothing else. `mcp` is here because the
# agent-facing MCP server (mcp_server.py) is a P1 headline deliverable, not an
# add-on. Generation backends (ComfyUI, cloud providers) add their own deps in P2.
dependencies = ["mcp[cli]>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10", "httpx>=0.27"]
# Local ASR for caption_clip / transcribe MCP tools (not required for core edit/render).
transcribe = ["faster-whisper>=1.0"]
# Shot detection (ContentDetector); opencv backend optional.
scenes = ["scenedetect>=0.6"]
# Vocal/instrument separation (heavy: pulls torch).
stems = ["demucs>=4.0"]
# P3 minimal web shell.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
all = [
    "faster-whisper>=1.0",
    "scenedetect>=0.6",
    "demucs>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.urls]
Homepage = "https://github.com/kumhou/Opmiere"

[project.scripts]
opmiere = "opmiere.cli:main"
opmiere-mcp = "opmiere.mcp_server:main"
opmiere-web = "opmiere.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opmiere"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
