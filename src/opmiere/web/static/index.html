<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opmiere</title>
  <style>
    :root { --bg:#0f1115; --panel:#1a1d24; --border:#2a2f3a; --text:#e8eaed; --muted:#9aa0a6; --acc:#7c9cff; --ok:#3dd68c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; }
    header h1 { font-size:18px; margin:0; font-weight:600; letter-spacing:0.02em; }
    header span { color:var(--muted); font-size:13px; }
    main { display:grid; grid-template-columns: 280px 1fr 320px; height: calc(100vh - 52px); }
    section { border-right:1px solid var(--border); padding:16px; overflow:auto; }
    section:last-child { border-right:none; }
    h2 { font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin:0 0 12px; }
    label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
    input, textarea, select, button {
      width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
      background:#12151b; color:var(--text); font-size:13px;
    }
    textarea { min-height:72px; resize:vertical; }
    button { cursor:pointer; background:var(--acc); color:#0b0d12; border:none; font-weight:600; margin-top:10px; }
    button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    #log { font-family: ui-monospace, Consolas, monospace; font-size:11px; white-space:pre-wrap;
      background:#0c0e12; border:1px solid var(--border); border-radius:8px; padding:10px; min-height:120px; max-height:200px; overflow:auto; color:var(--muted); }
    #timeline { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; min-height:200px; }
    .track { margin-bottom:12px; }
    .track-label { font-size:11px; color:var(--muted); margin-bottom:4px; }
    .clips { display:flex; flex-wrap:wrap; gap:6px; }
    .clip { background:#232833; border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:11px; max-width:160px; }
    .clip strong { display:block; color:var(--acc); font-size:10px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#232833; font-size:11px; color:var(--ok); }
    .steps { font-size:12px; line-height:1.5; }
    .steps li { margin-bottom:6px; }
    .err { color:#ff7b72; }
  </style>
</head>
<body>
  <header>
    <h1>Opmiere</h1>
    <span>P3 minimal · agent-native core</span>
    <span class="pill" id="status">no project</span>
  </header>
  <main>
    <section>
      <h2>Project</h2>
      <label>Bundle path (.opm folder)</label>
      <input id="bundle" value="G:/Development/Opmiere/.opmiere_web_demo.opm" />
      <div class="row">
        <button type="button" id="btnCreate">Create</button>
        <button type="button" class="secondary" id="btnOpen">Open</button>
      </div>
      <label>FPS / W / H</label>
      <div class="row">
        <input id="fps" type="number" value="30" />
        <input id="w" type="number" value="1280" />
        <input id="h" type="number" value="720" />
      </div>
      <label>Place media path</label>
      <input id="media" placeholder="C:/path/to/clip.mp4" />
      <label>Kind</label>
      <select id="kind"><option>video</option><option>audio</option><option>image</option></select>
      <button type="button" id="btnPlace">Place file</button>
      <label>Export path</label>
      <input id="export" value="G:/Development/Opmiere/.opmiere_web_demo_out.mp4" />
      <button type="button" id="btnExport">Export</button>
      <button type="button" class="secondary" id="btnRefresh">Refresh state</button>
      <h2 style="margin-top:20px">Log</h2>
      <div id="log"></div>
    </section>
    <section>
      <h2>Timeline</h2>
      <div id="timeline"><p style="color:var(--muted)">Open or create a project.</p></div>
    </section>
    <section>
      <h2>Director brief</h2>
      <label>Intent (empty = defaults)</label>
      <textarea id="intent" placeholder="例：雨后氛围短片，旁白一句…"></textarea>
      <label>Asset paths (one per line, role a_roll)</label>
      <textarea id="assets" placeholder="C:/footage/clip1.mp4"></textarea>
      <button type="button" id="btnPlan">Plan session</button>
      <div class="steps" id="plan"><p style="color:var(--muted)">Plan steps appear here. Agent / MCP executes them; this UI is the human surface.</p></div>
    </section>
  </main>
  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    function log(msg, isErr) {
      const t = new Date().toLocaleTimeString();
      logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
      if (isErr) logEl.classList.add('err');
    }
    async function api(path, opts) {
      const r = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      const text = await r.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { raw: text }; }
      if (!r.ok) throw new Error(data.detail || data.raw || r.statusText);
      return data;
    }
    function renderState(s) {
      statusEl.textContent = s.id ? `project ${s.id}` : 'open';
      const tl = document.getElementById('timeline');
      if (!s.tracks || !s.tracks.length) {
        tl.innerHTML = '<p style="color:var(--muted)">Empty timeline — place a file.</p>';
        return;
      }
      tl.innerHTML = s.tracks.map(t => {
        const clips = (t.clips || []).map(c =>
          `<div class="clip"><strong>${c.id}</strong> start ${c.start} · in ${c.in}–${c.out}</div>`
        ).join('') || '<span style="color:var(--muted)">no clips</span>';
        return `<div class="track"><div class="track-label">${t.kind} · ${t.id}</div><div class="clips">${clips}</div></div>`;
      }).join('');
    }
    document.getElementById('btnCreate').onclick = async () => {
      try {
        const body = {
          bundle_path: document.getElementById('bundle').value,
          fps: +document.getElementById('fps').value,
          width: +document.getElementById('w').value,
          height: +document.getElementById('h').value,
        };
        const s = await api('/api/project/create', { method: 'POST', body: JSON.stringify(body) });
        renderState(s); log('created ' + body.bundle_path);
      } catch (e) { log(String(e.message || e), true); }
    };
    document.getElementById('btnOpen').onclick = async () => {
      try {
        const s = await api('/api/project/open', {
          method: 'POST',
          body: JSON.stringify({ bundle_path: document.getElementById('bundle').value }),
        });
        renderState(s); log('opened');
      } catch (e) { log(String(e.message || e), true); }
    };
    document.getElementById('btnPlace').onclick = async () => {
      try {
        const body = {
          path: document.getElementById('media').value,
          kind: document.getElementById('kind').value,
        };
        await api('/api/place', { method: 'POST', body: JSON.stringify(body) });
        const s = await api('/api/project/state');
        renderState(s); log('placed ' + body.path);
      } catch (e) { log(String(e.message || e), true); }
    };
    document.getElementById('btnExport').onclick = async () => {
      try {
        const out = document.getElementById('export').value;
        const r = await api('/api/export', { method: 'POST', body: JSON.stringify({ output_path: out }) });
        log('exported ' + r.output_path);
      } catch (e) { log(String(e.message || e), true); }
    };
    document.getElementById('btnRefresh').onclick = async () => {
      try {
        const s = await api('/api/project/state');
        renderState(s); log('refreshed');
      } catch (e) { log(String(e.message || e), true); }
    };
    document.getElementById('btnPlan').onclick = async () => {
      try {
        const lines = document.getElementById('assets').value.split(/\n/).map(s => s.trim()).filter(Boolean);
        const assets = lines.map(path => ({ path, role: 'a_roll' }));
        const body = {
          intent: document.getElementById('intent').value || null,
          assets,
          deliverable: {
            bundle_path: document.getElementById('bundle').value,
            export_path: document.getElementById('export').value,
          },
        };
        const r = await api('/api/brief', { method: 'POST', body: JSON.stringify(body) });
        const steps = (r.plan && r.plan.steps) || [];
        document.getElementById('plan').innerHTML =
          '<ol class="steps">' + steps.map(s =>
            `<li><code>${s.tool}</code> — ${s.purpose}</li>`
          ).join('') + '</ol>' +
          (r.brief.no_opinion ? '<p style="color:var(--muted);font-size:12px">no_opinion → DEFAULT_AESTHETIC applied</p>' : '');
        log('planned ' + steps.length + ' steps');
      } catch (e) { log(String(e.message || e), true); }
    };
  </script>
</body>
</html>
