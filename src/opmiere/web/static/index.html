<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opmiere</title>
  <style>
    :root {
      --bg:#0f1115; --panel:#1a1d24; --border:#2a2f3a; --text:#e8eaed;
      --muted:#9aa0a6; --acc:#7c9cff; --ok:#3dd68c; --bad:#ff7b72;
      --vclip:#3d5a80; --aclip:#2d6a4f; --play:#ff6b6b;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header {
      padding:10px 16px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    }
    header h1 { font-size:17px; margin:0; font-weight:600; }
    header .sub { color:var(--muted); font-size:12px; }
    main {
      display:grid;
      grid-template-columns: 280px minmax(0,1fr) 300px;
      height: calc(100vh - 48px);
    }
    section { border-right:1px solid var(--border); padding:12px 14px; overflow:auto; }
    section:last-child { border-right:none; }
    h2 {
      font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
      color:var(--muted); margin:14px 0 8px;
    }
    h2:first-child { margin-top:0; }
    label { display:block; font-size:11px; color:var(--muted); margin:6px 0 3px; }
    input, textarea, select, button {
      width:100%; padding:7px 9px; border-radius:7px; border:1px solid var(--border);
      background:#12151b; color:var(--text); font-size:12px;
    }
    textarea { min-height:52px; resize:vertical; }
    button {
      cursor:pointer; background:var(--acc); color:#0b0d12; border:none;
      font-weight:600; margin-top:6px;
    }
    button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
    button.danger { background:transparent; color:var(--bad); border:1px solid var(--bad); }
    button:disabled { opacity:0.45; cursor:not-allowed; }
    .row { display:flex; gap:6px; }
    .row > * { flex:1; }
    .pill {
      display:inline-block; padding:2px 8px; border-radius:999px;
      background:#232833; font-size:11px; color:var(--ok);
    }
    .pill.bad { color:var(--bad); }
    #log {
      font-family: ui-monospace, Consolas, monospace; font-size:10px; white-space:pre-wrap;
      background:#0c0e12; border:1px solid var(--border); border-radius:7px;
      padding:8px; min-height:72px; max-height:120px; overflow:auto; color:var(--muted);
    }
    #doctor {
      font-size:10px; font-family:ui-monospace,Consolas,monospace; color:var(--muted);
      white-space:pre-wrap; background:#0c0e12; border:1px solid var(--border);
      border-radius:7px; padding:8px; max-height:100px; overflow:auto;
    }
    #playerWrap {
      background:#000; border:1px solid var(--border); border-radius:10px;
      overflow:hidden; position:relative;
    }
    #player {
      display:block; width:100%; max-height:42vh; background:#000; outline:none;
    }
    #playerPlaceholder {
      color:var(--muted); font-size:12px; padding:48px 16px; text-align:center;
    }
    .tc {
      font-family: ui-monospace, Consolas, monospace; font-size:12px; color:var(--acc);
    }
    #ruler {
      position:relative; height:18px; margin-top:10px;
      background:#12151b; border:1px solid var(--border); border-radius:4px;
      font-size:9px; color:var(--muted); user-select:none; cursor:pointer;
    }
    #ruler .tick { position:absolute; top:2px; transform:translateX(-50%); white-space:nowrap; }
    #tracks {
      position:relative; margin-top:6px; min-height:120px;
      background:var(--panel); border:1px solid var(--border); border-radius:10px;
      padding:8px 8px 8px 0; overflow-x:auto;
    }
    .track-row { display:flex; align-items:stretch; margin-bottom:6px; min-height:36px; }
    .track-name {
      width:72px; flex-shrink:0; font-size:10px; color:var(--muted);
      padding:4px 6px; display:flex; align-items:center;
    }
    .track-lane {
      position:relative; flex:1; height:36px; background:#12151b;
      border-radius:4px; border:1px solid var(--border); min-width:200px;
    }
    .tclip {
      position:absolute; top:3px; bottom:3px; border-radius:4px;
      border:1px solid rgba(255,255,255,0.12); font-size:10px;
      padding:2px 6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
      cursor:pointer; color:#e8eaed;
    }
    .tclip.video { background:var(--vclip); }
    .tclip.audio { background:var(--aclip); }
    .tclip.selected { outline:2px solid var(--acc); z-index:2; }
    #playhead {
      position:absolute; top:0; bottom:0; width:2px; background:var(--play);
      z-index:5; pointer-events:none; left:0;
    }
    #playhead::before {
      content:""; position:absolute; top:-4px; left:-4px;
      border-left:5px solid transparent; border-right:5px solid transparent;
      border-top:6px solid var(--play);
    }
    #binList { font-size:11px; }
    .bin-item {
      padding:6px 8px; border:1px solid var(--border); border-radius:6px;
      margin-bottom:6px; background:#12151b; cursor:default;
    }
    .bin-item .meta { color:var(--muted); font-size:10px; margin-top:2px; }
    #searchHits, #fillerBox, #reviewBox { font-size:11px; color:var(--muted); }
    #searchHits .hit {
      border-left:2px solid var(--acc); padding:4px 8px; margin:4px 0;
      background:#12151b; cursor:pointer; border-radius:0 4px 4px 0;
    }
    .steps { font-size:11px; line-height:1.45; }
    .steps li { margin-bottom:4px; }
    #sheetWrap img { max-width:100%; border-radius:8px; border:1px solid var(--border); }
    .transport { display:flex; gap:6px; align-items:center; margin-top:8px; }
    .transport button { margin-top:0; flex:0 0 auto; width:auto; min-width:64px; }
    .transport input[type=range] { flex:1; }
  </style>
</head>
<body>
  <header>
    <h1>Opmiere</h1>
    <span class="sub">NLE shell · agent = MCP</span>
    <span class="pill" id="status">no project</span>
    <span class="pill" id="docPill">doctor ?</span>
    <span class="pill" id="proxyPill">proxy ?</span>
    <span class="tc" id="tcLabel">00:00.0 / 00:00.0</span>
  </header>
  <main>
    <!-- LEFT: project + media bin -->
    <section>
      <h2>Project</h2>
      <label>Bundle path (.opm)</label>
      <input id="bundle" value="G:/Development/Opmiere/.opmiere_web_demo.opm" />
      <div class="row">
        <button type="button" id="btnCreate">Create</button>
        <button type="button" class="secondary" id="btnOpen">Open</button>
      </div>
      <div class="row">
        <button type="button" class="secondary" id="btnSave">Save</button>
        <button type="button" class="secondary" id="btnUndo">Undo</button>
        <button type="button" class="secondary" id="btnRedo">Redo</button>
      </div>
      <label>FPS / W / H</label>
      <div class="row">
        <input id="fps" type="number" value="30" />
        <input id="w" type="number" value="1280" />
        <input id="h" type="number" value="720" />
      </div>
      <label>Place media</label>
      <input id="media" placeholder="C:/path/to/clip.mp4" />
      <div class="row">
        <select id="kind"><option>video</option><option>audio</option><option>image</option></select>
        <label style="display:flex;align-items:center;gap:4px;margin:0;font-size:11px">
          <input type="checkbox" id="buildProxy" style="width:auto" /> asset proxy
        </label>
      </div>
      <button type="button" id="btnPlace">Place file</button>
      <label>Export path</label>
      <input id="export" value="G:/Development/Opmiere/.opmiere_web_demo_out.mp4" />
      <label><input type="checkbox" id="norm" checked style="width:auto" /> normalize streaming</label>
      <button type="button" id="btnExport">Export + delivery_check</button>
      <button type="button" class="secondary" id="btnRefresh">Refresh</button>

      <h2>Media bin</h2>
      <div class="row">
        <button type="button" class="secondary" id="btnBin">Refresh bin</button>
        <button type="button" class="secondary" id="btnAllProxies">All proxies</button>
      </div>
      <div id="binList"><p style="color:var(--muted);font-size:11px">Open a project.</p></div>

      <h2>Log</h2>
      <div id="log"></div>
    </section>

    <!-- CENTER: player + timeline -->
    <section>
      <h2>Preview</h2>
      <div id="playerWrap">
        <div id="playerPlaceholder">Ensure timeline proxy, then play / scrub.</div>
        <video id="player" style="display:none" controls playsinline></video>
      </div>
      <div class="transport">
        <button type="button" class="secondary" id="btnProxy">Ensure proxy</button>
        <button type="button" class="secondary" id="btnProxyForce">Rebuild</button>
        <button type="button" class="secondary" id="btnPlay">Play</button>
        <input id="scrub" type="range" min="0" max="10" step="0.01" value="0" />
      </div>
      <div class="row" style="margin-top:6px">
        <button type="button" class="secondary" id="btnKeys">Keyframes</button>
        <button type="button" class="secondary" id="btnFrameStill">Still frame</button>
      </div>
      <img id="previewImg" alt="" style="display:none;max-width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--border)" />

      <h2>Timeline</h2>
      <div id="ruler"></div>
      <div id="tracks"><p style="color:var(--muted);padding:12px;font-size:12px">Empty — place media.</p></div>
      <div class="row" style="margin-top:8px">
        <button type="button" class="danger" id="btnRippleDel" disabled>Ripple delete clip</button>
        <button type="button" class="secondary" id="btnFillerDry" disabled>Filler plan</button>
        <button type="button" class="danger" id="btnFillerApply" disabled>Filler apply</button>
      </div>
      <div id="fillerBox"></div>
      <div id="reviewBox"></div>
      <div id="sheetWrap"></div>
    </section>

    <!-- RIGHT: craft + search + agent plan -->
    <section>
      <h2>Craft</h2>
      <div class="row">
        <button type="button" class="secondary" id="btnReview">review_cut</button>
        <button type="button" class="secondary" id="btnSheet">seq sheet</button>
      </div>
      <label>Project look</label>
      <div class="row">
        <select id="look">
          <option value="cinematic">cinematic</option>
          <option value="warm_resolve">warm_resolve</option>
          <option value="cool_setup">cool_setup</option>
          <option value="documentary">documentary</option>
          <option value="vintage">vintage</option>
          <option value="neutral">neutral</option>
        </select>
        <button type="button" class="secondary" id="btnLook">Apply</button>
      </div>
      <label>Style preset (blend with +)</label>
      <div class="row">
        <select id="style">
          <option value="documentary">documentary</option>
          <option value="ang_lee">ang_lee</option>
          <option value="horror">horror</option>
          <option value="ang_lee+horror">ang_lee+horror</option>
          <option value="wes_anderson">wes_anderson</option>
          <option value="cyberpunk">cyberpunk</option>
          <option value="thriller">thriller</option>
        </select>
        <button type="button" class="secondary" id="btnStyle">Apply</button>
      </div>

      <h2>Transcript search</h2>
      <input id="searchQ" placeholder="找到我说但是…" />
      <button type="button" class="secondary" id="btnSearch">Search cache</button>
      <div id="searchHits"></div>

      <h2>Doctor</h2>
      <button type="button" class="secondary" id="btnDoctor">Run doctor</button>
      <div id="doctor">not run</div>

      <h2>Director brief (hero)</h2>
      <label>Intent</label>
      <textarea id="intent" placeholder="可选；空 = defaults"></textarea>
      <label>Asset paths</label>
      <textarea id="assets" placeholder="C:/footage/clip1.mp4"></textarea>
      <button type="button" id="btnPlan">Plan session</button>
      <div class="steps" id="plan"><p style="color:var(--muted)">Plan steps appear here.</p></div>
    </section>
  </main>
  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const docPill = document.getElementById('docPill');
    const proxyPill = document.getElementById('proxyPill');
    const player = document.getElementById('player');
    const placeholder = document.getElementById('playerPlaceholder');
    const scrub = document.getElementById('scrub');
    const tcLabel = document.getElementById('tcLabel');

    let timeline = null;
    let selectedClipId = null;
    let scrubMax = 10;
    let syncingFromVideo = false;
    let playheadEl = null;

    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
    }
    function fmtTc(s) {
      s = Math.max(0, +s || 0);
      const m = Math.floor(s / 60);
      const sec = s - m * 60;
      return String(m).padStart(2,'0') + ':' + sec.toFixed(1).padStart(4,'0');
    }
    function setTc(t) {
      tcLabel.textContent = fmtTc(t) + ' / ' + fmtTc(scrubMax);
    }
    async function api(path, opts) {
      const r = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      const text = await r.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { raw: text }; }
      if (!r.ok) {
        const detail = data.detail;
        const msg = typeof detail === 'string' ? detail
          : (detail && JSON.stringify(detail)) || data.raw || r.statusText;
        throw new Error(msg);
      }
      return data;
    }

    async function refreshProxyPill() {
      try {
        const st = await api('/api/preview/status');
        if (st.fresh) {
          proxyPill.textContent = 'proxy fresh';
          proxyPill.classList.remove('bad');
        } else if (st.exists) {
          proxyPill.textContent = 'proxy STALE';
          proxyPill.classList.add('bad');
        } else {
          proxyPill.textContent = 'no proxy';
          proxyPill.classList.add('bad');
        }
      } catch {
        proxyPill.textContent = 'proxy ?';
      }
    }

    function setPlayhead(tSec) {
      if (!playheadEl || !timeline || !timeline.duration_frames) return;
      const lane = document.querySelector('.track-lane');
      if (!lane) return;
      const dur = Math.max(timeline.duration_seconds || scrubMax, 0.001);
      const pct = Math.min(1, Math.max(0, tSec / dur));
      // playhead is inside #tracks; lanes start after track-name 72px + padding
      const tracks = document.getElementById('tracks');
      const nameW = 72;
      const usable = tracks.clientWidth - nameW - 16;
      playheadEl.style.left = (nameW + pct * usable) + 'px';
    }

    function renderTimeline(tv) {
      timeline = tv;
      statusEl.textContent = tv.project_id ? `project ${tv.project_id}` : 'open';
      scrubMax = Math.max(0.5, +(tv.duration_seconds || 0.5));
      scrub.max = scrubMax;
      setTc(+scrub.value || 0);

      const ruler = document.getElementById('ruler');
      const tracksEl = document.getElementById('tracks');
      if (!tv.tracks || !tv.tracks.length || !tv.duration_frames) {
        ruler.innerHTML = '';
        tracksEl.innerHTML = '<p style="color:var(--muted);padding:12px;font-size:12px">Empty — place media.</p>';
        playheadEl = null;
        return;
      }

      // ruler ticks
      const nTicks = Math.min(8, Math.max(2, Math.ceil(scrubMax)));
      let ticks = '';
      for (let i = 0; i <= nTicks; i++) {
        const t = (scrubMax * i) / nTicks;
        const left = (i / nTicks) * 100;
        ticks += `<span class="tick" style="left:${left}%">${fmtTc(t)}</span>`;
      }
      ruler.innerHTML = ticks;
      ruler.onclick = (ev) => {
        const rect = ruler.getBoundingClientRect();
        const pct = (ev.clientX - rect.left) / rect.width;
        seekTo(pct * scrubMax);
      };

      const durF = Math.max(tv.duration_frames, 1);
      let html = '<div id="playhead"></div>';
      for (const tr of tv.tracks) {
        let clipsHtml = '';
        for (const c of tr.clips || []) {
          const left = (c.start_frame / durF) * 100;
          const width = Math.max(0.8, (c.duration_frames / durF) * 100);
          const sel = c.id === selectedClipId ? ' selected' : '';
          const kind = tr.kind === 'audio' ? 'audio' : 'video';
          clipsHtml += `<div class="tclip ${kind}${sel}" data-id="${c.id}" data-t="${c.start_seconds}"
            style="left:${left}%;width:${width}%" title="${c.label} · ${c.id}">${c.label}</div>`;
        }
        html += `<div class="track-row">
          <div class="track-name">${tr.kind}<br/>${tr.id.slice(0,10)}</div>
          <div class="track-lane">${clipsHtml}</div>
        </div>`;
      }
      tracksEl.innerHTML = html;
      playheadEl = document.getElementById('playhead');
      setPlayhead(+scrub.value || 0);

      tracksEl.querySelectorAll('.tclip').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          selectedClipId = el.dataset.id;
          document.querySelectorAll('.tclip').forEach(x => x.classList.toggle('selected', x.dataset.id === selectedClipId));
          document.getElementById('btnRippleDel').disabled = !selectedClipId;
          document.getElementById('btnFillerDry').disabled = !selectedClipId;
          document.getElementById('btnFillerApply').disabled = !selectedClipId;
          seekTo(+el.dataset.t || 0);
          log('select ' + selectedClipId);
        };
      });
      tracksEl.querySelectorAll('.track-lane').forEach(lane => {
        lane.onclick = (ev) => {
          if (ev.target.classList.contains('tclip')) return;
          const rect = lane.getBoundingClientRect();
          const pct = (ev.clientX - rect.left) / rect.width;
          seekTo(pct * scrubMax);
        };
      });
    }

    function attachProxyVideo(bust) {
      const url = '/api/preview/proxy.mp4?t=' + (bust || Date.now());
      placeholder.style.display = 'none';
      player.style.display = 'block';
      player.src = url;
      player.load();
    }

    function seekTo(t) {
      t = Math.max(0, Math.min(scrubMax, +t || 0));
      scrub.value = t;
      setTc(t);
      setPlayhead(t);
      if (player.style.display !== 'none' && player.src) {
        syncingFromVideo = true;
        try { player.currentTime = t; } catch (_) {}
        syncingFromVideo = false;
      }
    }

    async function refreshAll() {
      const tv = await api('/api/project/timeline');
      renderTimeline(tv);
      await refreshProxyPill();
      await refreshBin();
      if (tv.proxy && tv.proxy.exists && tv.proxy.fresh) {
        // keep current video if already loaded
      }
      return tv;
    }

    async function refreshBin() {
      try {
        const bin = await api('/api/media');
        const el = document.getElementById('binList');
        if (!bin.media || !bin.media.length) {
          el.innerHTML = '<p style="color:var(--muted);font-size:11px">Empty bin.</p>';
          return;
        }
        el.innerHTML = bin.media.map(m => `
          <div class="bin-item" data-id="${m.id}">
            <div><b>${m.kind}</b> ${m.path}</div>
            <div class="meta">${m.id} · frames ${m.duration_frames}
              · proxy ${m.proxy_ready ? '✓' : '—'}
              · asr ${m.transcript_cached ? '✓' : '—'}</div>
            <button type="button" class="secondary bin-proxy" data-id="${m.id}" style="margin-top:4px">Build proxy</button>
          </div>`).join('');
        el.querySelectorAll('.bin-proxy').forEach(btn => {
          btn.onclick = async () => {
            try {
              const r = await api('/api/media/proxy', {
                method: 'POST',
                body: JSON.stringify({ media_id: btn.dataset.id }),
              });
              log('media proxy ' + (r.cache_hit ? 'hit ' : 'built ') + r.media_id);
              await refreshBin();
            } catch (e) { log(String(e.message || e)); }
          };
        });
      } catch (e) {
        document.getElementById('binList').innerHTML =
          `<p style="color:var(--bad);font-size:11px">${e.message || e}</p>`;
      }
    }

    // --- bindings ---
    document.getElementById('btnCreate').onclick = async () => {
      try {
        const body = {
          bundle_path: document.getElementById('bundle').value,
          fps: +document.getElementById('fps').value,
          width: +document.getElementById('w').value,
          height: +document.getElementById('h').value,
        };
        await api('/api/project/create', { method: 'POST', body: JSON.stringify(body) });
        await refreshAll();
        log('created ' + body.bundle_path);
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnOpen').onclick = async () => {
      try {
        await api('/api/project/open', {
          method: 'POST',
          body: JSON.stringify({ bundle_path: document.getElementById('bundle').value }),
        });
        await refreshAll();
        log('opened');
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnSave').onclick = async () => {
      try {
        await api('/api/save', { method: 'POST', body: '{}' });
        log('saved');
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnUndo').onclick = async () => {
      try {
        const r = await api('/api/undo', { method: 'POST', body: '{}' });
        if (r.ok && r.timeline) renderTimeline(r.timeline);
        log(r.ok ? 'undo' : 'nothing to undo');
        await refreshProxyPill();
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnRedo').onclick = async () => {
      try {
        const r = await api('/api/redo', { method: 'POST', body: '{}' });
        if (r.ok && r.timeline) renderTimeline(r.timeline);
        log(r.ok ? 'redo' : 'nothing to redo');
        await refreshProxyPill();
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnPlace').onclick = async () => {
      try {
        const body = {
          path: document.getElementById('media').value,
          kind: document.getElementById('kind').value,
          build_proxy: document.getElementById('buildProxy').checked,
        };
        await api('/api/place', { method: 'POST', body: JSON.stringify(body) });
        await refreshAll();
        log('placed ' + body.path);
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnExport').onclick = async () => {
      try {
        const out = document.getElementById('export').value;
        const r = await api('/api/export', {
          method: 'POST',
          body: JSON.stringify({
            output_path: out,
            normalize_preset: document.getElementById('norm').checked ? 'streaming' : null,
            run_delivery_check: true,
          }),
        });
        const dc = r.delivery_check;
        log('exported ' + r.output_path + (dc ? ` · delivery ok=${dc.ok}` : ''));
        if (dc && !dc.ok) log('delivery errors: ' + (dc.errors || []).join('; '));
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnRefresh').onclick = async () => {
      try {
        await refreshAll();
        log('refreshed');
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnBin').onclick = () => refreshBin().catch(e => log(String(e.message || e)));
    document.getElementById('btnAllProxies').onclick = async () => {
      try {
        const r = await api('/api/media/proxies', { method: 'POST' });
        log('proxies built=' + (r.built || []).length + ' hits=' + (r.cache_hits || []).length);
        await refreshBin();
      } catch (e) { log(String(e.message || e)); }
    };

    document.getElementById('btnProxy').onclick = async () => {
      try {
        log('ensure proxy…');
        const r = await api('/api/preview/ensure', { method: 'POST', body: '{}' });
        scrubMax = Math.max(0.5, +(r.duration_seconds || scrubMax));
        scrub.max = scrubMax;
        attachProxyVideo(Date.now());
        await refreshProxyPill();
        log((r.cache_hit ? 'cache hit ' : 'built ') + scrubMax.toFixed(2) + 's');
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnProxyForce').onclick = async () => {
      try {
        log('rebuild proxy…');
        const r = await api('/api/preview/build', {
          method: 'POST', body: JSON.stringify({ force: true }),
        });
        scrubMax = Math.max(0.5, +(r.duration_seconds || scrubMax));
        scrub.max = scrubMax;
        attachProxyVideo(Date.now());
        await refreshProxyPill();
        if (timeline) {
          const tv = await api('/api/project/timeline');
          renderTimeline(tv);
        }
        log('rebuilt ' + scrubMax.toFixed(2) + 's');
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnPlay').onclick = () => {
      if (player.style.display === 'none' || !player.src) {
        log('ensure proxy first');
        return;
      }
      if (player.paused) player.play(); else player.pause();
    };
    document.getElementById('btnKeys').onclick = async () => {
      try {
        const r = await api('/api/preview/keyframes?count=5', { method: 'POST' });
        log('keyframes ' + r.count);
        await refreshProxyPill();
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnFrameStill').onclick = () => {
      const t = +scrub.value || 0;
      const img = document.getElementById('previewImg');
      img.style.display = 'block';
      img.src = '/api/preview/frame.jpg?t=' + encodeURIComponent(t) + '&width=720&_=' + Date.now();
      log('still @ ' + fmtTc(t));
    };

    scrub.oninput = () => {
      const t = +scrub.value;
      setTc(t);
      setPlayhead(t);
    };
    scrub.onchange = () => seekTo(+scrub.value);
    player.ontimeupdate = () => {
      if (syncingFromVideo) return;
      const t = player.currentTime || 0;
      scrub.value = t;
      setTc(t);
      setPlayhead(t);
    };

    document.getElementById('btnRippleDel').onclick = async () => {
      if (!selectedClipId) return;
      try {
        await api('/api/ripple_delete', {
          method: 'POST', body: JSON.stringify({ clip_id: selectedClipId }),
        });
        selectedClipId = null;
        document.getElementById('btnRippleDel').disabled = true;
        document.getElementById('btnFillerDry').disabled = true;
        document.getElementById('btnFillerApply').disabled = true;
        await refreshAll();
        log('ripple deleted');
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnFillerDry').onclick = async () => {
      if (!selectedClipId) return;
      try {
        const r = await api('/api/filler', {
          method: 'POST',
          body: JSON.stringify({ clip_id: selectedClipId, dry_run: true }),
        });
        document.getElementById('fillerBox').innerHTML =
          `<b>filler dry_run</b> cuts=${(r.cut_ranges||[]).length} keep=${(r.keep_ranges||[]).length}` +
          `<pre style="font-size:10px;overflow:auto;max-height:120px">${JSON.stringify(r.cut_ranges||[], null, 0)}</pre>`;
        log('filler plan cuts=' + (r.cut_ranges||[]).length);
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnFillerApply').onclick = async () => {
      if (!selectedClipId) return;
      try {
        const r = await api('/api/filler', {
          method: 'POST',
          body: JSON.stringify({ clip_id: selectedClipId, dry_run: false }),
        });
        log('filler applied=' + r.applied);
        selectedClipId = null;
        await refreshAll();
      } catch (e) { log(String(e.message || e)); }
    };

    document.getElementById('btnReview').onclick = async () => {
      try {
        const r = await api('/api/review', { method: 'POST', body: '{}' });
        const issues = (r.issues || []).map(i =>
          `<div>· <b>${i.severity}</b> ${i.code}: ${i.message || ''}</div>`
        ).join('') || '<div style="color:var(--ok)">no issues</div>';
        document.getElementById('reviewBox').innerHTML = `<h2>review ok=${r.ok}</h2>${issues}`;
        log('review_cut ok=' + r.ok);
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnSheet').onclick = async () => {
      try {
        const r = await api('/api/sequence_sheet', { method: 'POST', body: '{}' });
        document.getElementById('sheetWrap').innerHTML =
          `<img src="/api/sequence_sheet/image?t=${Date.now()}" alt="sheet" />`;
        log('sheet tiles=' + r.tile_count);
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnLook').onclick = async () => {
      try {
        const look = document.getElementById('look').value;
        const r = await api('/api/look', { method: 'POST', body: JSON.stringify({ look }) });
        log('look ' + look + ' · clips ' + r.clip_count);
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnStyle').onclick = async () => {
      try {
        const styles = document.getElementById('style').value;
        const r = await api('/api/style', { method: 'POST', body: JSON.stringify({ styles }) });
        log('style ' + styles + ' · ' + JSON.stringify(r.styles || r.applied || r).slice(0, 120));
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnSearch').onclick = async () => {
      try {
        const q = document.getElementById('searchQ').value;
        const r = await api('/api/search_transcripts', {
          method: 'POST', body: JSON.stringify({ query: q }),
        });
        const hits = r.hits || [];
        const box = document.getElementById('searchHits');
        if (!hits.length) {
          box.innerHTML = '<p style="color:var(--muted)">No hits (need transcribe_media cache).</p>';
          return;
        }
        box.innerHTML = hits.map(h =>
          `<div class="hit" data-t="${h.start}">${fmtTc(h.start)} · ${h.text || ''} <span style="opacity:.6">${h.media_id || ''}</span></div>`
        ).join('');
        box.querySelectorAll('.hit').forEach(el => {
          el.onclick = () => seekTo(+el.dataset.t);
        });
        log('search hits=' + hits.length);
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnDoctor').onclick = async () => {
      try {
        const r = await api('/api/doctor?check_comfy=false');
        docPill.textContent = r.ok ? 'doctor ok' : 'doctor FAIL';
        docPill.classList.toggle('bad', !r.ok);
        document.getElementById('doctor').textContent =
          (r.summary || '') + '\n' + (r.checks || []).map(c =>
            `${c.ok ? 'OK' : 'FAIL'} ${c.id}`
          ).join('\n');
        log('doctor ok=' + r.ok);
      } catch (e) { log(String(e.message || e)); }
    };
    document.getElementById('btnPlan').onclick = async () => {
      try {
        const lines = document.getElementById('assets').value.split(/\n/).map(s => s.trim()).filter(Boolean);
        const assets = lines.map(path => ({ path, role: 'a_roll' }));
        const r = await api('/api/brief', {
          method: 'POST',
          body: JSON.stringify({
            intent: document.getElementById('intent').value || null,
            assets,
            deliverable: {
              bundle_path: document.getElementById('bundle').value,
              export_path: document.getElementById('export').value,
            },
          }),
        });
        const steps = (r.plan && r.plan.steps) || [];
        document.getElementById('plan').innerHTML =
          '<ol class="steps">' + steps.map(s =>
            `<li><code>${s.tool}</code> — ${s.purpose}</li>`
          ).join('') + '</ol>';
        log('planned ' + steps.length + ' steps');
      } catch (e) { log(String(e.message || e)); }
    };

    document.getElementById('btnDoctor').click();
  </script>
</body>
</html>
