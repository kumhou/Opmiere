# Opmiere CI — zero GitHub-hosted minutes (private-repo policy)
#
# Canonical gate (always):
#   powershell -ExecutionPolicy Bypass -File .\scripts\ci.ps1
#   powershell -ExecutionPolicy Bypass -File .\scripts\ci.ps1 -Quick
#
# Why this file is not "push → windows-latest":
#   Private repos consume Actions minutes on GitHub-hosted runners.
#   Continuous ship burned the quota; jobs failed in ~1s with no runner
#   (steps=[], runner_id=0). That is not a test flake — it is billing.
#
# Optional GitHub path (free): register a Windows self-hosted runner with
# labels [self-hosted, Windows, opmiere], then run this workflow manually
# (Actions → ci → Run workflow). Self-hosted does not use hosted minutes.
# See: https://docs.github.com/en/actions/hosting-your-own-runners
#
# Push/PR auto-triggers intentionally omitted so empty/failed hosted runs
# never reappear on every release commit.

name: ci

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Doctor + pytest only (skip dogfood)"
        type: boolean
        default: false

concurrency:
  group: opmiere-ci-selfhosted
  cancel-in-progress: true

jobs:
  test:
    name: test (self-hosted)
    runs-on: [self-hosted, Windows, opmiere]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Local CI script
        shell: pwsh
        env:
          OPMIERE_SKIP_COMFY: "1"
        run: |
          $q = "${{ inputs.quick }}"
          if ($q -eq "true") {
            powershell -ExecutionPolicy Bypass -File .\scripts\ci.ps1 -Quick
          } else {
            powershell -ExecutionPolicy Bypass -File .\scripts\ci.ps1
          }
