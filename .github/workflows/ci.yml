name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Doctor (no ComfyUI)
        run: python -m opmiere doctor --no-comfy --json

      - name: Pytest
        run: python -m pytest tests/ -q --tb=line
        env:
          # Keep tests offline; no ComfyUI in CI
          OPMIERE_SKIP_COMFY: "1"

      - name: Dogfood pro pipeline
        run: python scripts/dogfood_pro_pipeline.py --seconds 1.5

      - name: Dogfood cut template → finish_delivery
        run: python scripts/dogfood_template_pipeline.py --seconds 1.2 --template talking_head

      - name: Dogfood agent session (preflight → finish)
        run: python scripts/dogfood_agent_pipeline.py --seconds 1.2 --template talking_head
